<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Perjalanan Haji 3D</title>
<meta name="description" content="Game perjalanan haji 3D: pilih tamattu', ifrad, atau qiran; miqat, ihram, thawaf, sa'i, Arafah, Muzdalifah, Mina, jumrah, tahalul, hingga thawaf wada'. Dilengkapi kalender hari, kuis, doa, rukun, wajib, dan dam. Prototipe DRAF.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f0e0b">
<style>
:root{--bg:#0f0e0b;--card:rgba(24,21,15,.88);--card2:rgba(40,35,24,.9);--gold:#d4af37;--gold2:#f1d36b;--ink:#f4efe0;--mut:#b9b09a;--ok:#5fbf7a;--bad:#e2685a;--line:rgba(212,175,55,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.ar{font-family:"Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic",serif;direction:rtl;text-align:center;font-size:1.65rem;line-height:2.1;color:var(--gold2)}
/* HUD */
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));width:min(360px,calc(100vw - 150px));z-index:5;pointer-events:none}
#hud .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px)}
#chips{display:flex;gap:4px;margin-bottom:8px}
#chips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
#chips i.on{background:var(--gold)}#chips i.cur{background:var(--gold2);box-shadow:0 0 6px var(--gold)}
#stg{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
#obj{font-weight:600;margin-top:2px}
#sub{font-size:.85rem;color:var(--mut);margin-top:2px}
#ring{display:flex;align-items:center;gap:10px;margin-top:8px}
#ring.hidden{display:none}
#ring svg{width:46px;height:46px;flex:none}
#ringTxt{font-size:.85rem}
#btns{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:6;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.rb{width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,#f3d675,#a87f1c);color:#2a1d02;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.rb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb:active{transform:scale(.94)}
#mini{width:132px;height:132px;border-radius:50%;border:2px solid var(--gold);background:rgba(15,14,11,.55);margin-top:2px}
#arrow{position:fixed;top:max(150px,calc(env(safe-area-inset-top) + 138px));left:max(12px,env(safe-area-inset-left));z-index:5;pointer-events:none;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 12px 4px 6px;font-size:.85rem}
#arrow svg{width:30px;height:30px;transition:transform .1s linear}
#action{position:fixed;left:50%;bottom:max(34px,calc(env(safe-area-inset-bottom) + 20px));transform:translateX(-50%);z-index:7;min-width:200px;max-width:min(86vw,420px);padding:13px 22px;border-radius:30px;border:2px solid var(--gold2);background:linear-gradient(#f3d675,#c89a28);color:#2a1d02;font-weight:700;font-size:1rem;box-shadow:0 4px 18px rgba(0,0,0,.5);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 4px 26px rgba(241,211,107,.75)}}
#joy{position:fixed;left:max(24px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);z-index:4;touch-action:none}
#joy b{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff}
#run{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(36px,env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(241,211,107,.25);z-index:4;font-weight:700;letter-spacing:.04em;font-size:.8rem}
#run.on{background:rgba(241,211,107,.7);color:#2a1d02}
#lookpad{position:fixed;inset:0;z-index:2;touch-action:none}
body.nojoy #joy,body.nojoy #run{display:none}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast>div{background:var(--card2);border:1px solid var(--gold);border-radius:12px;padding:8px 14px;text-align:center;animation:tin .25s;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#toast>div .ar{font-size:1.25rem;line-height:1.7;padding:0}
#toast small{display:block;color:var(--mut)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* Modal & layar */
.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,7,5,.72);padding:12px;touch-action:pan-y}
.dlg{width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto;background:var(--card);border:1px solid var(--gold);border-radius:18px;padding:18px 18px 16px;box-shadow:0 10px 40px rgba(0,0,0,.6);user-select:text;-webkit-user-select:text}
.dlg h2{margin:0 0 2px;font-size:1.25rem;color:var(--gold2)}
.dlg .sub{color:var(--mut);font-size:.88rem;margin-bottom:8px}
.dlg .lat{font-style:italic;text-align:center;margin:2px 0 6px}
.dlg .arti{color:#ddd5bf;font-size:.95rem;text-align:center;margin-bottom:6px}
.dlg .src{color:var(--mut);font-size:.78rem;text-align:center;margin-bottom:6px}
.dlg .note{background:rgba(212,175,55,.1);border-left:3px solid var(--gold);padding:8px 10px;border-radius:6px;margin:8px 0;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{padding:10px 18px;border-radius:22px;border:1.5px solid var(--gold);background:rgba(212,175,55,.12)}
.btn.pri{background:linear-gradient(#f3d675,#c89a28);color:#2a1d02;font-weight:700;border-color:var(--gold2)}
.btn:disabled{opacity:.4}
.btn.ghost{border-color:rgba(255,255,255,.3);background:transparent}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.opt.sel{border-color:var(--gold2);background:rgba(212,175,55,.2)}
.opt.good{border-color:var(--ok);background:rgba(95,191,122,.2)}
.opt.wrong{border-color:var(--bad);background:rgba(226,104,90,.2)}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk i{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--gold);display:grid;place-items:center;margin-top:1px;font-style:normal;color:#2a1d02;font-weight:900}
.chk.sel i{background:var(--gold2)}
.chk.sel i::after{content:"✓"}
.fb{font-size:.85rem;margin-top:4px;color:#e8dfc4}
.good .fb{color:#bfe9c9}.wrong .fb{color:#f2b9b2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:10px;background:rgba(212,175,55,.2);border:1px solid var(--line);margin-right:4px}
.prog{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin:8px 0}
.prog b{display:block;height:100%;background:var(--gold2);width:0;transition:width .3s}
/* Layar penuh (intro, peta, ringkasan) */
.scr{position:fixed;inset:0;z-index:15;overflow:auto;background:radial-gradient(ellipse at 50% 20%,#2b2412,#0c0b08 70%);touch-action:pan-y}
.scr .in{width:min(880px,100%);margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 28px}
.scr h1{margin:6px 0 2px;font-size:1.7rem;color:var(--gold2)}
.scr p{margin:6px 0}
.logo{width:76px;height:76px;margin:0 auto;display:block}
#mapwrap{margin:10px 0}
#mapwrap svg{display:block;width:auto;max-width:100%;height:min(66vh,770px);margin:0 auto;border:1px solid var(--line);border-radius:14px;touch-action:manipulation}
.mq{cursor:pointer}
.mq circle{fill:var(--gold);stroke:#fff;stroke-width:2}
.mq.sel circle{fill:#fff;stroke:var(--gold2);stroke-width:4}
.mq text{fill:#fff;font-size:17px;paint-order:stroke;stroke:#000;stroke-width:3px}
.disc{font-size:.78rem;color:var(--mut);margin-top:10px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--gold2)}
.chip{display:inline-block;padding:7px 12px;border-radius:18px;border:1.5px solid rgba(255,255,255,.3);margin:3px;background:rgba(255,255,255,.06)}
.chip.sel{border-color:var(--gold2);background:rgba(212,175,55,.25)}
#load{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;text-align:center}
#fade{position:fixed;inset:0;z-index:18;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
@media (max-width:640px){.ar{font-size:1.4rem}#mini{width:104px;height:104px}.grid2{grid-template-columns:1fr}}

/* ---- Tambahan game Haji ---- */
#spd{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:max(122px,calc(env(safe-area-inset-bottom) + 112px));z-index:4;min-width:74px;height:50px;border-radius:25px;border:2px solid rgba(255,255,255,.45);background:rgba(20,18,12,.7);color:var(--gold2);font-weight:800;font-size:1.15rem;line-height:1.05;padding:4px 10px}
#spd small{display:block;font-size:.55rem;letter-spacing:.08em;color:var(--mut);font-weight:600}
.btn.play{padding:6px 14px;font-size:.88rem;display:block;margin:6px auto 0}
.btn.play.on{background:var(--gold2);color:#2a1d02}
.pst{min-height:1em}
#day{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:.78rem}
#day b{background:var(--gold);color:#2a1d02;border-radius:10px;padding:1px 9px}
#day span{color:var(--mut)}
#btns{display:grid;grid-template-columns:repeat(2,44px);gap:8px;justify-items:center;align-items:start}
#btns .rb{width:44px;height:44px}
#btns #mini{grid-column:1/3;justify-self:end}
.rb .t{font:700 .78rem/1 system-ui;letter-spacing:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px;position:sticky;top:0;background:linear-gradient(#17140d 70%,transparent);padding:8px 0 6px;z-index:2}
.tabs .chip{margin:0;padding:6px 12px;font-size:.88rem}
.sec{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;user-select:text;-webkit-user-select:text}
.sec h3{margin:0 0 6px;font-size:1.02rem;color:var(--gold2)}
.sec p{margin:5px 0}
.sec ul{margin:4px 0 4px 18px;padding:0}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:6px 0}
.tbl th,.tbl td{border:1px solid rgba(212,175,55,.25);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:rgba(212,175,55,.15);color:var(--gold2)}
.tbl td.k{white-space:nowrap}
.bdg{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:9px;margin-left:4px;border:1px solid var(--line);vertical-align:middle}
.bdg.q,.bdg.s{background:rgba(95,191,122,.2);border-color:var(--ok)}
.bdg.h{background:rgba(120,190,220,.2);border-color:#78bedc}
.bdg.k,.bdg.a{background:rgba(226,160,90,.2);border-color:#e2a05a}
.bdg.l{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.kt{display:inline-block;min-width:54px;text-align:center;font-size:.7rem;padding:1px 6px;border-radius:8px;margin-right:6px;font-weight:700}
.kt.r{background:#e2685a;color:#fff}.kt.w{background:#d4af37;color:#2a1d02}.kt.s{background:#5fbf7a;color:#102414}.kt.i{background:#78bedc;color:#06222e}
.doaI{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}
.doaI h4{margin:0 0 2px;font-size:.95rem}
.doaI .ar{font-size:1.4rem;line-height:2}
.mode{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.mode.sel{border-color:var(--gold2);background:rgba(212,175,55,.2)}
.mode h3{margin:0;font-size:1.1rem;color:var(--gold2)}
.mode small{color:var(--mut);display:block}
.mode ul{margin:6px 0 0 18px;padding:0;font-size:.85rem;color:#e3dac2}
.tl{display:flex;gap:4px;margin:8px 0 14px}
.tl div{flex:1;text-align:center;font-size:.7rem;padding:5px 2px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.tl div.cur{background:var(--gold);color:#2a1d02;font-weight:700}
.tl div.done{background:rgba(95,191,122,.25)}
.item{display:flex;gap:6px;margin:7px 0;font-size:.92rem}
.item .w{flex:none;width:92px;color:var(--gold);font-size:.8rem}
#pmap svg{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;background:#2b2616}
@keyframes dash{to{stroke-dashoffset:-28}}
.route{animation:dash 1.2s linear infinite}
.dlg.wide{width:min(760px,100%)}
#wukbar{position:fixed;left:50%;bottom:max(100px,calc(env(safe-area-inset-bottom) + 90px));transform:translateX(-50%);z-index:6;width:min(86vw,420px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;pointer-events:none}
#wukbar .prog{margin:4px 0 0}
#wukbar.warn{border-color:var(--bad)}
@media (max-width:640px){.item .w{width:70px}.tbl{font-size:.8rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}.tbl td.k{white-space:normal}#btns{grid-template-columns:repeat(2,40px)}#btns .rb{width:40px;height:40px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="lookpad"></div>
<div id="hud" class="hidden"><div class="card"><div id="day"></div><div id="chips"></div><div id="stg"></div><div id="obj"></div><div id="sub"></div>
<div id="ring" class="hidden"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="5"/><circle id="ringArc" cx="23" cy="23" r="19" fill="none" stroke="#f1d36b" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 23 23)"/><text id="ringN" x="23" y="28" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">0</text></svg><div id="ringTxt"></div></div></div></div>
<div id="arrow" class="hidden"><svg viewBox="0 0 30 30"><path d="M15 3 L25 25 L15 20 L5 25 Z" fill="#f1d36b" stroke="#000" stroke-width="1.5"/></svg><span id="arrTxt"></span></div>
<div id="btns" class="hidden">
 <button class="rb" id="bSet" aria-label="Pengaturan"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 <button class="rb" id="bHome" aria-label="Menu tahap"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
 <button class="rb" id="bMap" aria-label="Peta Makkah dan Armuzna"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg></button>
 <button class="rb" id="bDoa" aria-label="Buku doa"><svg viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3zM4 17a3 3 0 0 1 3-3h12"/></svg></button>
 <button class="rb" id="bRef" aria-label="Rukun, wajib, dam"><svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 12h8M8 16h8"/></svg></button>
 <button class="rb" id="bCam" aria-label="Ganti kamera"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="14" height="10" rx="2"/><path d="M16 11l6-3v8l-6-3"/></svg></button>
 <button class="rb" id="bFull" aria-label="Layar penuh"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
 <canvas id="mini" width="264" height="264"></canvas>
</div>
<button id="action" class="hidden"></button>
<button id="spd" class="hidden">×1</button>
<div id="joy" class="hidden"><b></b></div>
<button id="run" class="hidden">LARI</button>
<div id="wukbar" class="hidden"></div>
<div id="toast"></div>
<div id="modalHost"></div>
<div id="screenHost"></div>
<div id="fade"></div>
<div id="load"><div><svg class="logo" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#16140f"/><circle cx="256" cy="256" r="196" fill="none" stroke="#c9a24e" stroke-width="10" opacity=".35"/><circle cx="256" cy="256" r="150" fill="none" stroke="#c9a24e" stroke-width="10" opacity=".6"/><circle cx="256" cy="256" r="104" fill="none" stroke="#c9a24e" stroke-width="10" opacity=".9"/><rect x="206" y="206" width="100" height="100" rx="6" fill="#0a0a0a" stroke="#c9a24e" stroke-width="6"/><rect x="206" y="234" width="100" height="14" fill="#c9a24e"/></svg><p style="margin-top:12px;color:var(--gold2)">Memuat model 3D Makkah dan Armuzna…</p></div></div>
<script src="vendor/three.min.js"></script>
<script src="data.js"></script>
<script src="audio.js"></script>
<script src="ui.js"></script>
<script src="world.js"></script>
<script src="world2.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
