<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belajar Bahasa Arab — pengucapan, dialog, kuis</title>
<meta name="description" content="Latihan bahasa Arab untuk jamaah: cek pengucapan dengan pengenalan suara, latihan dialog bermain peran, kuis, dan analisis hasil belajar. Berjalan di perangkat; progres tersimpan lokal.">
<style>
:root{
  --bg:#fdfaf4; --kertas:#ffffff; --tinta:#12212f; --tinta2:#4a6274; --garis:#e4dccd;
  --hijau:#0f6e5c; --hijau2:#0b5446; --emas:#e3c485; --salah:#b3392f; --benar:#177a4d; --kuning:#b7791f;
  --lembut:#eef6f3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-tema="terang"]){
    --bg:#101820; --kertas:#18232e; --tinta:#e8eef3; --tinta2:#a9bccb; --garis:#2a3844;
    --hijau:#6ec3ae; --hijau2:#0b3f36; --salah:#ef8a80; --benar:#6fd4a0; --kuning:#e6b85c; --lembut:#1c2c36;
  }
}
:root[data-tema="gelap"]{
  --bg:#101820; --kertas:#18232e; --tinta:#e8eef3; --tinta2:#a9bccb; --garis:#2a3844;
  --hijau:#6ec3ae; --hijau2:#0b3f36; --salah:#ef8a80; --benar:#6fd4a0; --kuning:#e6b85c; --lembut:#1c2c36;
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{background:var(--bg); color:var(--tinta); font:15px/1.55 "Segoe UI","Helvetica Neue",-apple-system,Arial,sans-serif; -webkit-text-size-adjust:100%}
.ar{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic","Geeza Pro",serif; direction:rtl; line-height:1.9}
nav.sub{position:sticky; top:0; z-index:5; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; background:var(--kertas); border-bottom:1px solid var(--garis); padding:0 8px}
nav.sub::-webkit-scrollbar{display:none}
nav.sub button{flex:1 0 auto; font:inherit; font-weight:600; font-size:14px; color:var(--tinta2); background:none; border:0; border-bottom:3px solid transparent; padding:11px 14px 8px; cursor:pointer; white-space:nowrap}
nav.sub button[aria-selected="true"]{color:var(--hijau); border-bottom-color:var(--hijau)}
nav.sub button:focus-visible,.btn:focus-visible,select:focus-visible,.opsi:focus-visible,input:focus-visible{outline:2px solid var(--hijau); outline-offset:2px}
main{max-width:860px; margin:0 auto; padding:14px 14px 60px}
h2{font-size:18px; margin:6px 0 4px} h3{font-size:15px; margin:14px 0 6px}
p.ket{color:var(--tinta2); margin:2px 0 12px; font-size:13.5px}
.kartu{background:var(--kertas); border:1px solid var(--garis); border-radius:12px; padding:12px 14px; margin:10px 0}
.baris{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{font:inherit; font-size:14px; font-weight:600; cursor:pointer; border-radius:999px; padding:8px 16px; color:#fff; background:var(--hijau2); border:1px solid var(--hijau2)}
:root[data-tema="gelap"] .btn.utama{color:#06251f}
@media (prefers-color-scheme: dark){:root:not([data-tema="terang"]) .btn.utama{color:#06251f}}
.btn.utama{background:var(--hijau); border-color:var(--hijau)}
.btn.garis{background:transparent; color:var(--hijau); border-color:var(--hijau)}
.btn.kecil{padding:4px 11px; font-size:12.5px}
.btn:disabled{opacity:.45; cursor:default}
.btn.rekam.aktif{background:var(--salah); border-color:var(--salah); color:#fff; animation:denyut 1s infinite}
@keyframes denyut{50%{opacity:.65}}
select,input[type=text]{font:inherit; font-size:14px; color:var(--tinta); background:var(--kertas); border:1px solid var(--garis); border-radius:8px; padding:7px 10px; max-width:100%}
label.f{font-size:12.5px; color:var(--tinta2); display:flex; flex-direction:column; gap:3px}
.kata{display:grid; grid-template-columns:1fr; gap:2px}
.kata .ar{font-size:26px; text-align:right}
.lat{color:var(--hijau); font-style:italic; font-size:14px}
.id{font-size:14.5px} .en{font-size:12.5px; color:var(--tinta2)}
.item{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; padding:10px 0; border-top:1px solid var(--garis)}
.item:first-child{border-top:0}
.item .isi{flex:1; min-width:0}
.item .aksi{display:flex; flex-direction:column; gap:5px}
.lencana{display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; background:var(--lembut); color:var(--hijau); border:1px solid var(--garis)}
.lencana.b{color:var(--benar)} .lencana.s{color:var(--salah)} .lencana.k{color:var(--kuning)}
.skor{font-size:40px; font-weight:700; line-height:1}
.skor.b{color:var(--benar)} .skor.k{color:var(--kuning)} .skor.s{color:var(--salah)}
.diff{font-size:24px; display:flex; flex-wrap:wrap; gap:4px 10px; justify-content:flex-end; direction:rtl; margin:6px 0}
.diff span{padding:0 6px; border-radius:6px}
.diff .ok{background:rgba(23,122,77,.16); color:var(--benar)}
.diff .no{background:rgba(179,57,47,.15); color:var(--salah); text-decoration:underline wavy}
.dengar{font-size:13px; color:var(--tinta2); direction:rtl; text-align:right}
.opsi{display:block; width:100%; text-align:left; font:inherit; color:var(--tinta); background:var(--kertas); border:1.5px solid var(--garis); border-radius:10px; padding:10px 12px; margin:7px 0; cursor:pointer}
.opsi.ar{text-align:right; font-size:22px}
.opsi:hover:not(:disabled){border-color:var(--hijau)}
.opsi.benar{border-color:var(--benar); background:rgba(23,122,77,.13)}
.opsi.salah{border-color:var(--salah); background:rgba(179,57,47,.12)}
.opsi:disabled{cursor:default}
.soal-ar{font-size:34px; text-align:center; margin:8px 0}
.bar{height:9px; border-radius:99px; background:var(--garis); overflow:hidden}
.bar > i{display:block; height:100%; background:var(--hijau); border-radius:99px}
.bar.b > i{background:var(--benar)} .bar.k > i{background:var(--kuning)} .bar.s > i{background:var(--salah)}
.metrik{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.metrik .kartu{margin:0; text-align:center}
.metrik b{display:block; font-size:26px; line-height:1.15} .metrik small{color:var(--tinta2)}
.baris-s{display:grid; grid-template-columns:130px 1fr 44px; gap:8px; align-items:center; margin:7px 0; font-size:13.5px}
.baris-s span:last-child{text-align:right; font-variant-numeric:tabular-nums}
.susun{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:52px; direction:rtl; padding:8px; border:1.5px dashed var(--garis); border-radius:10px; margin:8px 0}
.susun button{font-size:22px}
.kunci{font:inherit; font-size:22px; padding:2px 12px; border-radius:8px; cursor:pointer; background:var(--kertas); color:var(--tinta); border:1.5px solid var(--garis)}
.giliran{max-width:92%; margin:10px 0; padding:10px 12px; border-radius:12px; border:1px solid var(--garis); background:var(--kertas)}
.giliran.lawan{margin-right:auto; border-top-left-radius:2px}
.giliran.saya{margin-left:auto; border-top-right-radius:2px; background:var(--lembut); border-color:var(--hijau)}
.giliran.mati{opacity:.45}
.giliran .p{font-size:11.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--tinta2)}
.giliran .ar{font-size:23px; text-align:right}
.info{font-size:13px; padding:9px 12px; border-radius:10px; background:var(--lembut); border:1px solid var(--garis); color:var(--tinta2); margin:10px 0}
.info.peringatan{border-color:var(--kuning); color:var(--tinta)}
svg.garis{width:100%; height:120px; display:block}
.kosong{color:var(--tinta2); text-align:center; padding:26px 8px}
[hidden]{display:none!important}
@media (max-width:520px){ .baris-s{grid-template-columns:96px 1fr 40px} .kata .ar{font-size:24px} }
</style></head>

/* ===== Normalisasi Arab & penilaian ===== */
function normAr(s){
  return String(s||'')
    .replace(/[ً-ٰٟـۖ-ۭ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/[^ء-ي0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
/* Sasaran ucapan: ambil alternatif pertama sebelum "/", buang "..." penanda isian */
function sasaran(ar){
  var s = String(ar).split('/')[0].replace(/\.{2,}|…/g,' ');
  return normAr(s);
}
function lev(a,b){
  var m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  var d=[], i, j;
  for(j=0;j<=n;j++) d[j]=j;
  for(i=1;i<=m;i++){
    var prev=d[0]; d[0]=i;
    for(j=1;j<=n;j++){
      var tmp=d[j];
      d[j]=Math.min(d[j]+1, d[j-1]+1, prev+(a[i-1]===b[j-1]?0:1));
      prev=tmp;
    }
  }
  return d[n];
}
function mirip(a,b){ var L=Math.max(a.length,b.length); return L ? 1-lev(a,b)/L : 1 }
/* Jajarkan kata sasaran dengan kata ucapan (LCS dengan toleransi kemiripan) */
function bandingkan(target, ucap){
  var T = target.split(' ').filter(Boolean), U = ucap.split(' ').filter(Boolean);
  var n=T.length, m=U.length, i, j, sk=[];
  for(i=0;i<=n;i++){ sk[i]=[]; for(j=0;j<=m;j++) sk[i][j]=0 }
  for(i=n-1;i>=0;i--) for(j=m-1;j>=0;j--){
    var s = mirip(T[i],U[j]);
    sk[i][j] = Math.max(sk[i+1][j], sk[i][j+1], sk[i+1][j+1] + (s>=0.67 ? s : 0));
  }
  var hasil = T.map(function(w){ return {w:w, s:0} });
  i=0; j=0;
  while(i<n && j<m){
    var s2 = mirip(T[i],U[j]);
    if(s2>=0.67 && Math.abs(sk[i][j]-(sk[i+1][j+1]+s2))<1e-9){ hasil[i].s=s2; i++; j++ }
    else if(sk[i+1][j] >= sk[i][j+1]) i++;
    else j++;
  }
  return hasil;
}
function nilaiUcapan(targetAr, ucapan){
  var t = sasaran(targetAr), u = normAr(ucapan);
  if(!t) return {skor:0, kata:[]};
  var kata = bandingkan(t, u);
  var rata = kata.length ? kata.reduce(function(a,x){return a+x.s},0)/kata.length : 0;
  var total = mirip(t.replace(/ /g,''), u.replace(/ /g,''));
  var skor = Math.round(100*(0.6*rata + 0.4*total));
  return {skor:Math.max(0,Math.min(100,skor)), kata:kata};
}

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var suaraArab = null;
function muatSuara(){
  if(!window.speechSynthesis) return;

}
if(window.speechSynthesis){ muatSuara(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', muatSuara) }
function ucapkan(teks, lambat, selesai){
  if(!window.speechSynthesis || !window.SpeechSynthesisUtterance){ if(selesai) selesai(); return false }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(teks).split('/')[0].replace(/\.{2,}|…/g,' '));
    u.lang = 'ar-SA'; if(suaraArab) u.voice = suaraArab;
    u.rate = lambat ? 0.6 : 0.9;
    if(selesai){ u.onend = selesai; u.onerror = selesai }
    speechSynthesis.speak(u);
    return true;
  }catch(e){ if(selesai) selesai(); return false }
}
var perekam = null;
function berhentiRekam(){ if(perekam){ try{ perekam.abort() }catch(e){} perekam = null } }
function dengarkan(cb){
  /* cb(err, [alternatif]) */
  berhentiRekam();
  var r = new SR(); perekam = r;
  r.lang = 'ar-SA'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
  var selesai = false;
  r.onresult = function(e){
    selesai = true;
    var alt = []; var res = e.results[0];
    for(var i=0;i<res.length;i++) alt.push(res[i].transcript);
    cb(null, alt);
  };
  r.onerror = function(e){ if(!selesai){ selesai = true; cb(e.error || 'error') } };

  try{ r.start() }catch(e){ cb('error') }
  return r;
}

function catatanSuara(){
  var d = [];
  if(!SR) d.push('Peramban ini belum mendukung pengenalan suara — pengucapan dinilai sendiri (Belum / Hampir / Lancar). Gunakan Chrome atau Edge terbaru (Android/desktop) untuk penilaian otomatis.');
  if(!window.speechSynthesis) d.push('Peramban ini tidak punya suara pembaca (TTS), sehingga tombol "Dengar" tidak tersedia.');
  else if(!suaraArab) d.push('Belum terdeteksi suara Arab pada perangkat; suara contoh mungkin tidak terdengar. Pasang suara Arab pada pengaturan teks-ke-suara perangkat.');
  if(!d.length) return null;
  return el('div', {class:'info peringatan'}, d.map(function(x){ return el('div', {text:x}) }));
}
var LAMBAT = false;

/* ===== 1. Belajar ===== */
function vBelajar(){
  elM.appendChild(el('h2', {text:'Kosakata & frasa'}));
  elM.appendChild(el('p', {class:'ket', text:KARTU.length+' frasa dari '+BAB.length+' bab panduan Bahasa Arab. Ketuk "Dengar" untuk contoh lafal; tandai bintang untuk frasa yang ingin dilatih.'}));
  var selBab = pilihBab('bab', 'Semua bab');
  var cari = el('input', {type:'text', placeholder:'Cari Arab / Latin / Indonesia…', 'aria-label':'Cari'});
  var cekLat = el('input', {type:'checkbox', id:'cl', checked:true});
  var cekBin = el('input', {type:'checkbox', id:'cb'});
  var tools = el('div', {class:'baris'}, [selBab, cari,
    el('label', {class:'baris', for:'cl'}, [cekLat, 'Latin']),
    el('label', {class:'baris', for:'cb'}, [cekBin, 'Hanya ★'])]);
  var daftar = el('div', {class:'kartu'});
  elM.appendChild(tools); elM.appendChild(daftar);
  function gambar(){
    daftar.textContent = '';
    var q = cari.value.trim().toLowerCase(), qn = normAr(cari.value);
    var hit = KARTU.filter(function(c){
      if(selBab.value!=='*' && c.bab!==selBab.value) return false;
      if(cekBin.checked && !S.tanda[c.k]) return false;
      if(!q) return true;
      return c.id.toLowerCase().indexOf(q)>=0 || c.lat.toLowerCase().indexOf(q)>=0 || c.en.toLowerCase().indexOf(q)>=0 || (qn && normAr(c.ar).indexOf(qn)>=0);
    });
    if(!hit.length){ daftar.appendChild(el('div', {class:'kosong', text:'Tidak ada yang cocok.'})); return }
    hit.slice(0,150).forEach(function(c){
      var it = S.item[c.k], pu = S.ucap[c.k];
      var lenc = [];
      if(it && it.n) lenc.push(el('span', {class:'lencana '+kelas(pct(it.ok/it.n)), text:'kuis '+it.ok+'/'+it.n}));
      if(pu) lenc.push(el('span', {class:'lencana '+kelas(pu.best), text:'lafal '+pu.best}));
      daftar.appendChild(el('div', {class:'item'}, [
        el('div', {class:'isi kata'}, [
          el('div', {class:'ar', text:c.ar, lang:'ar', dir:'rtl'}),
          cekLat.checked ? el('div', {class:'lat', text:c.lat}) : null,
          el('div', {class:'id', text:c.id}),
          el('div', {class:'en', text:c.en}),
          lenc.length ? el('div', {class:'baris'}, lenc) : null
        ]),
        el('div', {class:'aksi'}, [
          el('button', {class:'btn kecil', type:'button', text:'▶ Dengar', onclick:function(){ ucapkan(c.ar, LAMBAT) }}),
          el('button', {class:'btn kecil garis', type:'button', 'aria-pressed':!!S.tanda[c.k], text:S.tanda[c.k] ? '★ Ditandai' : '☆ Tandai', onclick:function(e){
            if(S.tanda[c.k]) delete S.tanda[c.k]; else S.tanda[c.k] = 1;
            simpan(); e.target.textContent = S.tanda[c.k] ? '★ Ditandai' : '☆ Tandai'; e.target.setAttribute('aria-pressed', !!S.tanda[c.k]);
          }}),
          el('button', {class:'btn kecil garis', type:'button', text:'🎤 Latih', onclick:function(){ ucapTarget = c.k; pilihTampil('ucap') }})
        ])
      ]));
    });
    if(hit.length>150) daftar.appendChild(el('div', {class:'info', text:'Menampilkan 150 dari '+hit.length+'. Persempit dengan pencarian atau pilihan bab.'}));
  }
  [selBab, cari, cekLat, cekBin].forEach(function(x){ x.addEventListener('input', gambar); x.addEventListener('change', gambar) });
  gambar();
}

/* ===== 2. Pengucapan ===== */
var ucapTarget = null, ucapAntrian = [], ucapIdx = 0;
function catatUcap(k, skor, otomatis){
  var u = S.ucap[k] || (S.ucap[k] = {n:0, sum:0, best:0});
  u.n++; u.sum += skor; u.best = Math.max(u.best, skor); u.t = Date.now(); u.m = otomatis ? 1 : 0;
  simpan();
}
function kotakSkor(wadah, target, skor, kata, alt, otomatis){
  wadah.textContent = '';
  var p = skor;
  wadah.appendChild(el('div', {class:'baris', style:'justify-content:space-between'}, [
    el('div', {class:'skor '+kelas(p), text:p+'%'}),
    el('div', {class:'ket', text: p>=85 ? 'Sangat baik — lafal terbaca jelas.' : p>=65 ? 'Cukup baik — perbaiki kata bertanda merah.' : 'Perlu diulang — dengar contoh, lalu coba perlahan.'})
  ]));
  if(kata && kata.length){
    var diff = el('div', {class:'diff', lang:'ar', dir:'rtl'});
    kata.forEach(function(x){ diff.appendChild(el('span', {class:x.s>=0.67?'ok':'no', text:x.w})) });
    wadah.appendChild(diff);
  }
  if(alt) wadah.appendChild(el('div', {class:'dengar'}, ['Terdengar: ', el('span', {lang:'ar', text:alt || '(kosong)'})]));
  if(!otomatis) wadah.appendChild(el('div', {class:'ket', text:'Penilaian mandiri — tidak diukur otomatis.'}));
}
function bagianLatih(c, opsi){
  /* Kartu latihan lafal untuk satu frasa. opsi.setelah(skor) dipanggil setelah menilai. */
  var hasil = el('div', {'aria-live':'polite'});
  var tmb = el('button', {class:'btn rekam utama', type:'button', text:'🎤 Ucapkan'});
  var kartu = el('div', {class:'kartu'}, [
    el('div', {class:'soal-ar ar', text:c.ar, lang:'ar', dir:'rtl'}),
    el('div', {style:'text-align:center'}, [el('div', {class:'lat', text:c.lat}), el('div', {class:'id', text:c.id})]),
    el('div', {class:'baris', style:'justify-content:center; margin-top:10px'}, [
      el('button', {class:'btn garis', type:'button', text:'▶ Dengar', onclick:function(){ ucapkan(c.ar, LAMBAT) }}),
      el('button', {class:'btn garis', type:'button', text:'🐢 Lambat', onclick:function(){ ucapkan(c.ar, true) }}),
      tmb
    ]),
    hasil
  ]);
  function selesaiNilai(skor, kata, alt, otomatis){
    catatUcap(c.k, skor, otomatis);
    kotakSkor(hasil, c.ar, skor, kata, alt, otomatis);
    if(opsi && opsi.setelah) opsi.setelah(skor);
    tmb.classList.remove('aktif'); tmb.textContent = '🎤 Ulangi';
  }
  if(SR){
    tmb.addEventListener('click', function(){
      if(tmb.classList.contains('aktif')){ berhentiRekam(); return }
      if(window.speechSynthesis) try{ speechSynthesis.cancel() }catch(e){}
      tmb.classList.add('aktif'); tmb.textContent = '⏹ Mendengarkan…'; hasil.textContent = '';
      dengarkan(function(err, alt){
        tmb.classList.remove('aktif'); tmb.textContent = '🎤 Ulangi';
        if(err){ hasil.textContent = ''; hasil.appendChild(el('div', {class:'info peringatan', text:PESAN_ERR[err] || ('Gagal merekam ('+err+').')})); return }
        var terbaik = null, teks = '';
        alt.forEach(function(a){ var n = nilaiUcapan(c.ar, a); if(!terbaik || n.skor>terbaik.skor){ terbaik = n; teks = a } });
        selesaiNilai(terbaik.skor, terbaik.kata, teks, true);
      });
    });
  } else {
    tmb.textContent = '🎤 Saya sudah mencoba'; tmb.classList.remove('utama');
    tmb.addEventListener('click', function(){
      hasil.textContent = '';
      hasil.appendChild(el('div', {class:'ket', text:'Bagaimana lafal Anda dibanding contoh?'}));
      hasil.appendChild(el('div', {class:'baris', style:'justify-content:center'}, [['Belum',30],['Hampir',65],['Lancar',100]].map(function(x){
        return el('button', {class:'btn garis', type:'button', text:x[0], onclick:function(){ selesaiNilai(x[1], null, null, false) }});
      })));
    });
  }
  return kartu;
}
function vUcap(){
  elM.appendChild(el('h2', {text:'Cek pengucapan'}));
  elM.appendChild(el('p', {class:'ket', text:'Dengar contoh, ucapkan frasa, dan lihat kata mana yang kurang tepat. Penilaian membandingkan hasil pengenalan suara dengan teks sasaran (tanpa harakat) — ini indikator, bukan pengganti guru tahsin/bahasa Arab.'}));
  var cs = catatanSuara(); if(cs) elM.appendChild(cs);
  var selBab = pilihBab('bab', 'Semua bab');
  var mode = el('select', {'aria-label':'Mode'}, [
    el('option', {value:'acak', text:'Acak'}), el('option', {value:'lemah', text:'Yang masih lemah'}),
    el('option', {value:'tanda', text:'Yang ditandai ★'}), el('option', {value:'urut', text:'Berurutan'})]);
  var cekLambat = el('input', {type:'checkbox', id:'lb'});
  cekLambat.addEventListener('change', function(){ LAMBAT = cekLambat.checked });
  cekLambat.checked = LAMBAT;
  var tools = el('div', {class:'baris'}, [selBab, mode, el('label', {class:'baris', for:'lb'}, [cekLambat, 'Contoh pelan'])]);
  var area = el('div'); var nav = el('div', {class:'baris', style:'justify-content:space-between'});
  elM.appendChild(tools); elM.appendChild(area); elM.appendChild(nav);
  function susun(){
    var pool = KARTU.filter(function(c){ return (selBab.value==='*' || c.bab===selBab.value) && sasaran(c.ar).length>0 });
    if(mode.value==='tanda') pool = pool.filter(function(c){ return S.tanda[c.k] });
    if(mode.value==='lemah'){
      pool.sort(function(a,b){ return (S.ucap[a.k] ? S.ucap[a.k].best : -1) - (S.ucap[b.k] ? S.ucap[b.k].best : -1) });
      pool = pool.filter(function(c){ return !S.ucap[c.k] || S.ucap[c.k].best<80 }).slice(0,30);
    } else if(mode.value==='acak') pool = acak(pool);
    ucapAntrian = pool; ucapIdx = 0;
    if(ucapTarget){
      var pos = ucapAntrian.findIndex(function(c){ return c.k===ucapTarget });
      if(pos<0 && KUNCI_KARTU[ucapTarget]){ ucapAntrian.unshift(KUNCI_KARTU[ucapTarget]); pos = 0 }
      ucapIdx = Math.max(0,pos); ucapTarget = null;
    }
    tunjuk();
  }
  function tunjuk(){
    area.textContent = ''; nav.textContent = '';
    if(!ucapAntrian.length){ area.appendChild(el('div', {class:'kosong', text: mode.value==='tanda' ? 'Belum ada frasa bertanda ★. Tandai dari menu Belajar.' : 'Tidak ada frasa untuk pilihan ini.'})); return }
    var c = ucapAntrian[ucapIdx];
    area.appendChild(bagianLatih(c));
    var pu = S.ucap[c.k];
    nav.appendChild(el('button', {class:'btn garis', type:'button', text:'← Sebelumnya', disabled:ucapIdx===0, onclick:function(){ ucapIdx--; tunjuk() }}));
    nav.appendChild(el('span', {class:'ket', text:(ucapIdx+1)+' / '+ucapAntrian.length+(pu ? ' · terbaik '+pu.best+'% · '+pu.n+'×' : '')}));
    nav.appendChild(el('button', {class:'btn', type:'button', text:'Berikutnya →', disabled:ucapIdx>=ucapAntrian.length-1, onclick:function(){ ucapIdx++; tunjuk() }}));
  }
  [selBab, mode].forEach(function(x){ x.addEventListener('change', susun) });
  susun();
}

/* ===== 3. Dialog (bermain peran) ===== */
function vDialog(){
  elM.appendChild(el('h2', {text:'Dialog bermain peran'}));
  elM.appendChild(el('p', {class:'ket', text:DIALOG.length+' dialog situasi nyata (bandara, hotel, restoran, rumah sakit, dll.). Pilih peran Anda; lawan bicara dibacakan suara perangkat, giliran Anda diucapkan lewat mikrofon dan dinilai.'}));
  var cs = catatanSuara(); if(cs) elM.appendChild(cs);
  var sel = el('select', {'aria-label':'Pilih dialog'});
  DIALOG.forEach(function(d, i){ sel.appendChild(el('option', {value:i, text:(BABJUDUL[d.bab]||'')+' — '+d.t})) });
  var area = el('div');
  elM.appendChild(sel); elM.appendChild(area);
  sel.addEventListener('change', function(){ siapkan(DIALOG[+sel.value]) });
  siapkan(DIALOG[0]);

  function siapkan(d){
    area.textContent = '';
    var pemb = []; d.turns.forEach(function(t){ if(pemb.indexOf(t.s)<0) pemb.push(t.s) });
    var nama = {}; d.turns.forEach(function(t){ nama[t.s] = t.p });
    area.appendChild(el('div', {class:'kartu'}, [
      el('div', {class:'id', text:d.ctx || d.t}),
      el('div', {class:'baris', style:'margin-top:8px'}, [
        el('span', {class:'ket', text:'Peran Anda:'}),
        pemb.map(function(s){ return el('button', {class:'btn', type:'button', text:nama[s], onclick:function(){ mulai(d, s) }}) })[0],
        pemb[1] ? el('button', {class:'btn', type:'button', text:nama[pemb[1]], onclick:function(){ mulai(d, pemb[1]) }}) : null,
        el('button', {class:'btn garis', type:'button', text:'▶ Dengarkan semua', onclick:function(){ putarSemua(d) }})
      ])
    ]));
    /* pratinjau */
    var pv = el('div'); d.turns.forEach(function(t){ pv.appendChild(gelembung(t, t.s===pemb[0] ? 'lawan':'saya', false)) });
    area.appendChild(pv);
  }
  function gelembung(t, sisi, mati){
    return el('div', {class:'giliran '+sisi+(mati?' mati':'')}, [
      el('div', {class:'p', text:t.p}), el('div', {class:'ar', text:t.ar, lang:'ar', dir:'rtl'}),
      el('div', {class:'lat', text:t.lat}), el('div', {class:'id', text:t.id})
    ]);
  }
  var berhenti = false;
  function putarSemua(d){
    berhenti = false; var i = 0;
    (function lanjut(){ if(berhenti || i>=d.turns.length) return; ucapkan(d.turns[i++].ar, LAMBAT, function(){ setTimeout(lanjut, 350) }) })();
  }
  function mulai(d, peran){
    berhenti = true; area.textContent = '';
    var skorGiliran = [], kotak = el('div');
    area.appendChild(el('div', {class:'kartu'}, [el('b', {text:d.t}), el('div', {class:'ket', text:'Anda berperan sebagai '+d.turns.filter(function(t){return t.s===peran})[0].p+'.'}),
      el('button', {class:'btn garis kecil', type:'button', text:'← Pilih peran lain', onclick:function(){ berhentiRekam(); if(window.speechSynthesis) speechSynthesis.cancel(); siapkan(d) }})]));
    area.appendChild(kotak);
    var i = 0;
    function maju(){
      if(i>=d.turns.length) return selesai();
      var t = d.turns[i];
      if(t.s!==peran){
        var g = gelembung(t, 'lawan', false); kotak.appendChild(g); g.scrollIntoView({block:'nearest'});
        i++; ucapkan(t.ar, LAMBAT, function(){ setTimeout(maju, 300) });
      } else {
        var w = el('div'); 
        var k = { k:d.k+'/'+i, ar:t.ar, lat:t.lat, id:t.id };
        var idx = i;
        w.appendChild(bagianLatih(k, {setelah:function(skor){
          skorGiliran[idx] = skor; lanjutTombol.disabled = false;
        }}));
        /* bagianLatih mencatat ke S.ucap dengan kunci giliran — itu disengaja untuk analisis dialog */
        kotak.appendChild(w); w.scrollIntoView({block:'nearest'});
        var lanjutTombol = el('button', {class:'btn', type:'button', text: i===d.turns.length-1 ? 'Selesai' : 'Lanjut →', onclick:function(){ lanjutTombol.remove(); i = idx+1; maju() }});
        lanjutTombol.disabled = true;
        w.appendChild(el('div', {class:'baris', style:'justify-content:flex-end'}, [
          el('button', {class:'btn garis kecil', type:'button', text:'Lewati', onclick:function(){ lanjutTombol.remove(); i = idx+1; maju() }}), lanjutTombol]));
      }
    }
    function selesai(){
      var nilai = skorGiliran.filter(function(x){ return x!=null });
      var rata = nilai.length ? Math.round(nilai.reduce(function(a,b){return a+b},0)/nilai.length) : 0;
      if(nilai.length){ S.dialog.push({t:Date.now(), d:d.k, skor:rata, n:nilai.length, peran:peran}); simpan() }
      kotak.appendChild(el('div', {class:'kartu'}, [
        el('h3', {text:'Dialog selesai'}),
        nilai.length ? el('div', {class:'baris'}, [el('div', {class:'skor '+kelas(rata), text:rata+'%'}), el('div', {class:'ket', text:'rata-rata '+nilai.length+' giliran Anda'})])
                     : el('div', {class:'ket', text:'Tidak ada giliran yang dinilai.'}),
        el('div', {class:'baris', style:'margin-top:8px'}, [
          el('button', {class:'btn', type:'button', text:'Ulangi', onclick:function(){ mulai(d, peran) }}),
          el('button', {class:'btn garis', type:'button', text:'Tukar peran', onclick:function(){ var lain = d.turns.filter(function(t){return t.s!==peran})[0]; mulai(d, lain ? lain.s : peran) }})
        ])
      ]));
    }
    maju();
  }
}

/* ===== 4. Kuis ===== */
var JENIS = {
  arti:   'Arab → arti',
  arab:   'Arti → Arab',
  simak:  'Menyimak',
  dialog: 'Dialog',
  susun:  'Susun kalimat'
};
function pengecoh(c, n, kolom){
  var sama = KARTU.filter(function(x){ return x.k!==c.k && x[kolom]!==c[kolom] && (x.bab===c.bab) });
  var lain = KARTU.filter(function(x){ return x.k!==c.k && x[kolom]!==c[kolom] && x.bab!==c.bab });
  var seen = {}; seen[c[kolom]] = 1; var out = [];
  acak(sama).concat(acak(lain)).forEach(function(x){ if(out.length<n && !seen[x[kolom]] && x[kolom].length<110){ seen[x[kolom]] = 1; out.push(x) } });
  return out;
}
function buatSoal(jenis, c){
  if(jenis==='arti' || jenis==='simak'){
    var pg = pengecoh(c, 3, 'id');
    return {jenis:jenis, k:c.k, bab:c.bab, c:c, opsi:acak([c].concat(pg)).map(function(x){ return {t:x.id, ok:x.k===c.k} })};
  }
  if(jenis==='arab'){
    var pg2 = pengecoh(c, 3, 'ar');
    return {jenis:jenis, k:c.k, bab:c.bab, c:c, opsi:acak([c].concat(pg2)).map(function(x){ return {t:x.ar, ok:x.k===c.k, ar:true} })};
  }
  if(jenis==='susun'){
    var kata = c.ar.split('/')[0].replace(/\.{2,}|…/g,' ').split(/\s+/).filter(Boolean);
    return {jenis:jenis, k:c.k, bab:c.bab, c:c, kata:kata};
  }
}
function soalDialog(){
  var cand = [];
  DIALOG.forEach(function(d){ d.turns.forEach(function(t, i){ if(i+1<d.turns.length) cand.push({d:d, i:i}) }) });
  var x = cand[Math.floor(Math.random()*cand.length)];
  var benar = x.d.turns[x.i+1], salah = [];
  var semua = []; DIALOG.forEach(function(d){ d.turns.forEach(function(t){ if(t.ar!==benar.ar && t.ar!==x.d.turns[x.i].ar) semua.push(t) }) });
  salah = ambil(semua, 3);
  var key = x.d.k+'/'+(x.i+1);
  return {jenis:'dialog', k:key, bab:x.d.bab, d:x.d, tanya:x.d.turns[x.i], opsi:acak([benar].concat(salah)).map(function(t){ return {t:t.ar, lat:t.lat, id:t.id, ok:t===benar, ar:true} })};
}
function susunKuis(jenisDipilih, babId, n, hanyaLemah){
  var pool = KARTU.filter(function(c){ return (babId==='*' || c.bab===babId) });
  if(hanyaLemah){
    pool = pool.filter(function(c){ var it = S.item[c.k]; return it && it.n && it.ok/it.n<0.7 });
    if(pool.length<4) pool = KARTU.filter(function(c){ var it = S.item[c.k]; return !it || !it.n || it.ok/it.n<0.7 }).filter(function(c){ return babId==='*' || c.bab===babId });
  }
  pool = pool.filter(function(c){ return c.ar.length<70 });
  var soal = [], jenisAda = jenisDipilih.slice();
  if(jenisAda.indexOf('simak')>=0 && !window.speechSynthesis) jenisAda.splice(jenisAda.indexOf('simak'),1);
  if(!jenisAda.length) jenisAda = ['arti'];
  /* prioritaskan butir yang jarang diuji / lemah */
  pool.sort(function(a,b){
    var ia = S.item[a.k], ib = S.item[b.k];
    var sa = ia && ia.n ? ia.ok/ia.n : 0.5, sb = ib && ib.n ? ib.ok/ib.n : 0.5;
    return (sa+Math.random()*0.6) - (sb+Math.random()*0.6);
  });
  var dipakai = {};
  var hitung = 0, guard = 0;
  while(soal.length<n && guard++<400){
    var j = jenisAda[hitung++ % jenisAda.length];
    if(j==='dialog'){
      var s = soalDialog(); if(babId!=='*' && s.bab!==babId){ if(!DIALOG.some(function(d){return d.bab===babId})) continue }
      if(dipakai[s.k]) continue; dipakai[s.k] = 1; soal.push(s); continue;
    }
    var c = pool[soal.length % Math.max(1,pool.length)];
    if(!c) break;
    if(j==='susun'){
      var kb = pool.filter(function(x){ var w = x.ar.split('/')[0].replace(/\.{2,}|…/g,' ').split(/\s+/).filter(Boolean).length; return w>=2 && w<=7 && !dipakai['susun|'+x.k] });
      if(kb.length) c = kb[0]; else j = 'arti';
    }
    var key = j+'|'+c.k; if(dipakai[key]){ pool = pool.slice(1).concat(pool.slice(0,1)); continue }
    dipakai[key] = 1; var q = buatSoal(j, c); if(q.opsi && q.opsi.length<2) continue; soal.push(q);
  }
  return acak(soal);
}
function vKuis(){
  elM.appendChild(el('h2', {text:'Kuis'}));
  elM.appendChild(el('p', {class:'ket', text:'Kuis menguji lima keterampilan. Hasil tiap soal direkam untuk analisis kemampuan di menu Analisis.'}));
  var selBab = pilihBab('bab', 'Semua bab');

  ]));
  elM.appendChild(area);

  function jalankan(soal, babId){
    elM.textContent = '';
    if(!soal.length){ elM.appendChild(el('div', {class:'kosong', text:'Tidak ada soal untuk pilihan ini.'})); return }
    var idx = 0, benar = 0, mulai = Date.now(), perJenis = {}, perBab = {}, salahList = [];
    var kepala = el('div', {class:'baris', style:'justify-content:space-between'});
    var bar = el('div', {class:'bar'}, [el('i')]);

    function tampilSoal(){
      if(idx>=soal.length) return hasil();
      var q = soal[idx]; kotak.textContent = '';
      kepala.textContent = ''; kepala.appendChild(el('span', {class:'lencana', text:JENIS[q.jenis]})); kepala.appendChild(el('span', {class:'ket', text:'Soal '+(idx+1)+' / '+soal.length}));
      bar.firstChild.style.width = pct(idx/soal.length)+'%';
      var jawab = function(ok, tanya){

        var pb = perBab[q.bab] || (perBab[q.bab] = [0,0]); pb[0]++; if(ok) pb[1]++;

      };

    function soalPilihan(q, jawab){
      var c = q.c;

    function soalDlg(q, jawab){

      kotak.appendChild(el('div', {class:'giliran lawan'}, [el('div', {class:'p', text:q.tanya.p}), el('div', {class:'ar', text:q.tanya.ar, lang:'ar', dir:'rtl'}), el('div', {class:'id', text:q.tanya.id}),
        el('button', {class:'btn garis kecil', type:'button', text:'▶ Dengar', onclick:function(){ ucapkan(q.tanya.ar, LAMBAT) }})]));

          kotak.appendChild(el('div', {class:'info'}, tombol.filter(function(x){return x.o.ok}).map(function(x){ return x.o.id+' — '+x.o.lat }).concat([])));
          jawab(o.ok);
        }});
        tombol.push({b:b, o:o}); kotak.appendChild(b);
      });
    }
    function soalSusun(q, jawab){
      var c = q.c, urutan = [], acakKata = acak(q.kata.map(function(w,i){ return {w:w, i:i} }));
      if(acakKata.length>1 && acakKata.every(function(x,i){ return x.i===i })) acakKata.reverse();

      var tujuan = el('div', {class:'susun', lang:'ar'}), bank = el('div', {class:'susun', lang:'ar', style:'border-style:solid'});
      var cekBtn = el('button', {class:'btn utama', type:'button', text:'Periksa', disabled:true});
      var ulang = el('button', {class:'btn garis', type:'button', text:'Reset', onclick:function(){ urutan = []; render() }});
      kotak.appendChild(tujuan); kotak.appendChild(bank); kotak.appendChild(el('div', {class:'baris'}, [cekBtn, ulang]));
      function render(){
        tujuan.textContent = ''; bank.textContent = '';
        urutan.forEach(function(x, p){ tujuan.appendChild(el('button', {class:'kunci', type:'button', text:x.w, onclick:function(){ urutan.splice(p,1); render() }})) });
        acakKata.forEach(function(x){ if(urutan.indexOf(x)<0) bank.appendChild(el('button', {class:'kunci', type:'button', text:x.w, onclick:function(){ urutan.push(x); render() }})) });
        cekBtn.disabled = urutan.length!==acakKata.length;
      }
      cekBtn.addEventListener('click', function(){
        var ok = urutan.every(function(x,p){ return normAr(x.w)===normAr(q.kata[p]) });
        cekBtn.disabled = true; ulang.disabled = true;
        [].forEach.call(kotak.querySelectorAll('.kunci'), function(b){ b.disabled = true });
        tujuan.style.borderColor = ok ? 'var(--benar)' : 'var(--salah)';
        kotak.appendChild(el('div', {class:'info'}, [ok ? 'Tepat. ' : 'Susunan benar: ', el('span', {class:'ar', lang:'ar', text:q.kata.join(' ')}), ' — ', el('i', {text:c.lat})]));
        jawab(ok);
      });
      render();
    }
    function hasil(){
      kepala.textContent = ''; bar.firstChild.style.width = '100%'; kotak.textContent = '';
      var p = pct(benar/soal.length);
      S.kuis.push({t:Date.now(), n:soal.length, ok:benar, bab:babId, jenis:perJenis, babs:perBab, dur:Math.round((Date.now()-mulai)/1000)});
      if(S.kuis.length>200) S.kuis = S.kuis.slice(-200);

      Object.keys(perJenis).forEach(function(j){ kotak.appendChild(barisSkor(JENIS[j], perJenis[j][0] ? perJenis[j][1]/perJenis[j][0] : 0, perJenis[j][1]+'/'+perJenis[j][0])) });
      if(salahList.length){

        var seen = {};

          if(!c || seen[q.k]) return; seen[q.k] = 1;
          kotak.appendChild(el('div', {class:'item'}, [el('div', {class:'isi kata'}, [el('div', {class:'ar', text:c.ar, lang:'ar', dir:'rtl'}), el('div', {class:'lat', text:c.lat}), el('div', {class:'id', text:c.id})]),

        });

        el('button', {class:'btn utama', type:'button', text:'Kuis lagi', onclick:function(){ pilihTampil('kuis') }}),
        el('button', {class:'btn garis', type:'button', text:'Lihat analisis', onclick:function(){ pilihTampil('analisis') }})]));
    }
    tampilSoal();
  }
}

/* ===== 5. Analisis ===== */
function barisSkor(label, frac, teks){
  var p = pct(frac);
  return el('div', {class:'baris-s'}, [el('span', {text:label}), el('div', {class:'bar '+kelas(p)}, [el('i', {style:'width:'+p+'%'})]), el('span', {text:teks || p+'%'})]);
}
function garisTren(titik){
  var W = 600, H = 120, pad = 18, n = titik.length;
  var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','garis'); svg.setAttribute('role','img');
  svg.setAttribute('aria-label','Tren skor kuis: '+titik.map(function(x){return x+'%'}).join(', '));
  function xy(i, v){ return [pad + (n>1 ? i*(W-2*pad)/(n-1) : (W-2*pad)/2), H-pad-(v/100)*(H-2*pad)] }
  [0,50,100].forEach(function(v){
    var y = xy(0,v)[1];
    var l = document.createElementNS(svg.namespaceURI,'line'); l.setAttribute('x1',pad); l.setAttribute('x2',W-pad); l.setAttribute('y1',y); l.setAttribute('y2',y); l.setAttribute('stroke','currentColor'); l.setAttribute('opacity','.15'); svg.appendChild(l);
    var t = document.createElementNS(svg.namespaceURI,'text'); t.setAttribute('x',0); t.setAttribute('y',y+4); t.setAttribute('font-size','10'); t.setAttribute('fill','currentColor'); t.setAttribute('opacity','.6'); t.textContent = v; svg.appendChild(t);
  });
  var d = titik.map(function(v,i){ var p = xy(i,v); return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1) }).join(' ');
  var pth = document.createElementNS(svg.namespaceURI,'path'); pth.setAttribute('d',d); pth.setAttribute('fill','none'); pth.setAttribute('stroke','var(--hijau)'); pth.setAttribute('stroke-width','2.5'); svg.appendChild(pth);
  titik.forEach(function(v,i){ var p = xy(i,v); var c = document.createElementNS(svg.namespaceURI,'circle'); c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]); c.setAttribute('r',3.5); c.setAttribute('fill','var(--hijau)'); svg.appendChild(c) });
  return svg;
}
function ringkasan(){
  var ids = Object.keys(S.item).filter(function(k){ return KUNCI_KARTU[k] });
  var n = 0, ok = 0, kuasai = 0, lemah = [];
  ids.forEach(function(k){
    var it = S.item[k]; n += it.n; ok += it.ok;
    var a = it.ok/it.n;
    if(it.n>=2 && a>=0.75) kuasai++;
    if(it.n>=1 && a<0.6) lemah.push({k:k, a:a, n:it.n});
  });
  var skill = {}; /* jenis soal */
  ids.concat(Object.keys(S.item).filter(function(k){ return !KUNCI_KARTU[k] })).forEach(function(k){
    var it = S.item[k]; Object.keys(it.j).forEach(function(j){ var s = skill[j] || (skill[j] = [0,0]); s[0] += it.j[j][0]; s[1] += it.j[j][1] });
  });
  var uk = Object.keys(S.ucap), usum = 0, un = 0, ubest = 0, ulemah = [];
  uk.forEach(function(k){ var u = S.ucap[k]; usum += u.sum; un += u.n; ubest += u.best; if(u.best<65 && KUNCI_KARTU[k]) ulemah.push({k:k, best:u.best}) });
  return {n:n, ok:ok, kuasai:kuasai, dicoba:ids.length, lemah:lemah.sort(function(a,b){return a.a-b.a}), skill:skill,
    ucapN:uk.length, ucapRata:un ? Math.round(usum/un) : null, ucapBest:uk.length ? Math.round(ubest/uk.length) : null, ulemah:ulemah.sort(function(a,b){return a.best-b.best})};
}
function tingkat(r){
  var cakupan = r.kuasai/KARTU.length;
  var akurasi = r.n ? r.ok/r.n : 0;
  if(r.n<10) return ['Belum cukup data', 'Kerjakan minimal 10 soal kuis agar perkiraan bermakna.'];
  if(cakupan<0.08) return ['Pemula', 'Baru mengenal frasa dasar. Fokus pada sapaan, angka, dan kata ganti.'];
  if(cakupan<0.25 || akurasi<0.6) return ['Dasar', 'Sudah menguasai sebagian frasa harian; perbanyak ulangan butir lemah.'];
  if(cakupan<0.5 || akurasi<0.75) return ['Menengah awal', 'Cukup untuk situasi umum di bandara, hotel, dan restoran; lanjutkan dialog dan pengucapan.'];
  return ['Menengah', 'Penguasaan frasa luas dan akurat; perdalam tata bahasa dan percakapan bebas.'];
}

  if(kart.children.length>1) elM.appendChild(kart);

      el('div', {class:'ket', text:'Rata-rata 5 terakhir: '+Math.round(last.slice(-5).reduce(function(a,b){return a+b},0)/Math.min(5,last.length))+'% · sebelumnya: '+(last.length>5 ? Math.round(last.slice(0,-5).reduce(function(a,b){return a+b},0)/(last.length-5))+'%' : '—')})]));
  }

  /* per bab */
  var perBab = {};
  Object.keys(S.item).forEach(function(k){ var c = KUNCI_KARTU[k], it = S.item[k]; if(!c) return; var b = perBab[c.bab] || (perBab[c.bab] = [0,0,0]); b[0] += it.n; b[1] += it.ok; if(it.n>=2 && it.ok/it.n>=0.75) b[2]++ });
  var ba = Object.keys(perBab);
  if(ba.length){

    ba.sort(function(a,b){ return perBab[a][1]/perBab[a][0] - perBab[b][1]/perBab[b][0] }).forEach(function(id){
      var s = perBab[id]; kb.appendChild(barisSkor(BABJUDUL[id].replace(/&.*/,'').slice(0,22), s[1]/s[0], pct(s[1]/s[0])+'%'));
    });

  /* butir lemah + rekomendasi */
  var rk = el('div', {class:'kartu'}, [el('h3', {text:'Rekomendasi'})]);

  if(r.lemah.length) ul.appendChild(el('li', {text:r.lemah.length+' frasa masih di bawah 60% — ulangi lewat "Kuis butir lemah".'}));

  if(r.dicoba<KARTU.length*0.3) ul.appendChild(el('li', {text:'Baru '+r.dicoba+' dari '+KARTU.length+' frasa pernah diuji. Pakai "Semua bab" agar cakupan bertambah.'}));
  if(!ul.children.length) ul.appendChild(el('li', {text:'Hasil baik. Pertahankan dengan ulangan berkala dan coba dialog dengan peran berbeda.'}));

    }}),
    el('button', {class:'btn garis', type:'button', text:'Latih lafal yang lemah', onclick:function(){ pilihTampil('ucap') }})]));
  elM.appendChild(rk);

  if(r.lemah.length){
    var kl = el('div', {class:'kartu'}, [el('h3', {text:'Butir terlemah'})]);
    r.lemah.slice(0,8).forEach(function(x){
      var c = KUNCI_KARTU[x.k];
      kl.appendChild(el('div', {class:'item'}, [el('div', {class:'isi kata'}, [el('div', {class:'ar', text:c.ar, lang:'ar', dir:'rtl'}), el('div', {class:'id', text:c.id}), el('span', {class:'lencana s', text:pct(x.a)+'% dari '+x.n+'×'})]),
        el('div', {class:'aksi'}, [el('button', {class:'btn kecil', type:'button', text:'▶ Dengar', onclick:function(){ ucapkan(c.ar, LAMBAT) }})])]));
    });

  elM.appendChild(el('div', {class:'baris'}, [
    el('button', {class:'btn garis kecil', type:'button', text:'Ekspor data (JSON)', onclick:function(){
      var blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
