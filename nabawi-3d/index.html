    <script>
      // Jembatan tema situs Panduan Ibadah: halaman induk menulis data-tema (terang/gelap) ke dokumen
      // tab ini; aplikasi memakai data-theme (light/dark). Tanpa data-tema, ikuti tema sistem.
      (function () {
        var de = document.documentElement, PETA = { terang: 'light', gelap: 'dark' };
        function selaras() {
          var v = PETA[de.getAttribute('data-tema')];
          if (v) { if (de.getAttribute('data-theme') !== v) de.setAttribute('data-theme', v); }
          else if (de.hasAttribute('data-theme')) de.removeAttribute('data-theme');
        }
        new MutationObserver(selaras).observe(de, { attributes: true, attributeFilter: ['data-tema'] });
        selaras();
      })();
    </script>
